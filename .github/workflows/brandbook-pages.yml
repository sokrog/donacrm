name: Publish Dona brandbook

on:
  push:
    branches: [main]
    paths:
      - 'design/dona-brandbook/**'
      - '.github/workflows/brandbook-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript
        run: |
          node --check design/dona-brandbook/app.js
          node --check design/dona-brandbook/assets.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: python3 design/dona-brandbook/build.py --pages
      - name: Validate published resources
        run: python3 design/dona-brandbook/validate_site.py
      - name: Upload public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: design/dona-brandbook/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report deployment URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: printf '### Dona brandbook\n\n[Open published brandbook](%s)\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
