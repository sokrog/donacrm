<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fce6ed" />
    <meta name="description" content="DONA CRM — локальная CRM для торговли" />
    <title>DONA CRM</title>
    <style>html, body { margin: 0; background: #fce6ed; }</style>
    <link rel="stylesheet" href="_content/Dona.Crm.UI/styles/boot.css" />
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="_content/Dona.Crm.UI/dona.css" />
    <link rel="stylesheet" href="Dona.Crm.Web.Client.styles.css" />
    <link rel="stylesheet" href="browser.css" />
</head>
<body>
    <div id="app"><div class="dona-boot" role="status" aria-live="polite" aria-label="Загрузка DONA CRM">
            <img class="dona-boot__logo" src="_content/Dona.Crm.UI/brand/dona-logo.png" width="280" height="140" alt="DONA" />
            <p class="dona-boot__caption">Управление магазином</p>
            <span class="dona-boot__progress" aria-hidden="true"></span>
            <p class="dona-boot__status">Загружаем…</p>
        </div></div>


    <div id="blazor-error-ui" data-nosnippet>Не удалось продолжить работу. <a href=".">Перезагрузить</a></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="_content/Dona.Crm.UI/orbit-modal.js"></script>
    <script src="_content/Dona.Crm.UI/orbit-navigation.js"></script>
    <script src="browser-interop.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        // Local rebuilds can replace boot resources while a preview tab stays open.
        // Refresh only application resources; never clear the user's local data.
        const localPreview = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
        const previewVersion = Date.now();
        Blazor.start(localPreview ? {
            loadBootResource(type, name, defaultUri, integrity) {
                if (type === 'dotnetjs') {
                    const url = new URL(defaultUri, document.baseURI);
                    url.searchParams.set('preview', previewVersion);
                    return url.href;
                }
                return fetch(defaultUri, { cache: 'reload', integrity });
            }
        } : {});
    </script>
    <script>navigator.serviceWorker?.register('service-worker.js');</script>
</body>
</html>
